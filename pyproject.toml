[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpilot-ai"
version = "0.1.0"
description = "RapidNest LeadPilot AI lead-intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "openai>=2.0,<3",
    "pydantic>=2.8,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
